<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ocean Freight Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ocean: { 950: '#06151c', 900: '#0b2530', 800: '#113544', 600: '#1d6a7a', 400: '#3eb5c4' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen flex flex-col">
    <nav class="bg-ocean-950 text-white">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold tracking-tight">Ocean Freight Rate &amp; Tracker</h1>
                <span class="text-xs text-ocean-400">Sustainability Innovation</span>
            </div>
            <div class="flex items-center gap-3">
                {% if user %}
                    <span class="text-xs text-slate-300">{{ user.username }} · {{ user.role|upper }}</span>
                    <a href="/logout" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold px-3 py-1.5 rounded">Logout</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="flex-grow max-w-7xl w-full mx-auto p-6">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-ocean-900 text-center text-xs text-slate-400 py-4">
        Ocean Freight Rate &amp; Shipment Tracker
    </footer>
    <script src="/static/js/app.js"></script>
</body>
</html>
