services:
  - type: web
    name: ocean-freight-tracker
    env: python
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "gunicorn main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    plan: free
    numInstances: 1
    healthCheckPath: /
    autoDeploy: yes
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DATA_DIR
        value: /data
    disk:
      name: freight-data
      mountPath: /data
      sizeGB: 1
